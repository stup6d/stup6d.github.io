<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>artyom frstup6d</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1a1aff;
    --window-bg: #ffffff;
    --titlebar-bg: #e6e6e6;
    --text-main: #1a1a1a;
    --text-muted: #8a8a8a;
    --link-hover: #f2f2f2;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--blue);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
  }

  .desktop-icon {
    position: absolute;
    top: 32px;
    left: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 72px;
    cursor: pointer;
    user-select: none;
    text-decoration: none;
  }

  .desktop-icon .folder {
    width: 52px;
    height: 44px;
    object-fit: contain;
  }

  .desktop-icon span {
    font-size: 12px;
    color: #fff;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
    letter-spacing: 0.01em;
  }

  .personal-block {
    position: absolute;
    top: 130px;
    left: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    user-select: none;
  }

  .personal-label {
    font-size: 11px;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.6);
    margin: 0 0 2px;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
  }

  .personal-links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .personal-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #fff;
    font-size: 14px;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
    width: fit-content;
    transition: transform 0.15s ease;
  }

  .personal-link:hover {
    transform: translateX(4px);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.telegram { background: #4dd8d8; }
  .status-dot.instagram { background: #ffb020; }

  @media (max-width: 480px) {
    .desktop-icon { top: 16px; left: 16px; }
    .personal-block { top: 108px; left: 16px; }
  }

  .window {
    width: 100%;
    max-width: 707px;
    background: var(--window-bg);
    border-radius: 10px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
    overflow: hidden;
    animation: rise 0.5s ease-out;
    display: flex;
    flex-direction: column;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .titlebar {
    background: var(--titlebar-bg);
    height: 26px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    position: relative;
    border-bottom: 1px solid #d5d5d5;
  }

  .traffic-lights {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    display: block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.red { background: #ff5f57; }
  .dot.yellow { background: #febc2e; }
  .dot.green { background: #28c840; }

  .titlebar-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #555;
  }

  .content {
    padding: 56px 48px 64px;
    height: 494px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #d0d0d0 transparent;
  }

  .content::-webkit-scrollbar {
    width: 8px;
  }

  .content::-webkit-scrollbar-thumb {
    background: #d0d0d0;
    border-radius: 4px;
  }

  .content::-webkit-scrollbar-track {
    background: transparent;
  }

  .name {
    font-size: 28px;
    font-weight: 500;
    margin: 0 0 6px;
    color: var(--text-main);
    letter-spacing: -0.01em;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
  }

  .bio {
    font-size: 16px;
    color: var(--text-main);
    margin: 0 0 40px;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
  }

  .section-label {
    font-size: 11px;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 0 0 8px 4px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .edits-label {
    font-size: 11px;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 40px 0 10px 4px;
  }

  .edits-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 360px;
  }

  .edits-row {
    display: flex;
    gap: 4px;
    height: 110px;
  }

  .edits-row.row-top .edit-thumb:first-child {
    flex: 1.9;
  }
  .edits-row.row-top .edit-thumb:last-child {
    flex: 1;
  }

  .edits-row.row-bottom .edit-thumb {
    flex: 1;
  }

  .edit-thumb {
    position: relative;
    display: block;
    border-radius: 0;
    overflow: hidden;
    background: #1a1a1a;
    text-decoration: none;
  }

  .edit-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s ease;
  }

  .edit-thumb:hover img {
    transform: scale(1.05);
  }

  .link-item {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    text-decoration: none;
    color: var(--text-main);
    font-size: 15px;
    transition: background 0.15s ease, transform 0.15s ease;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
    width: fit-content;
  }

  .link-item:hover {
    transform: translateX(4px);
  }

  .link-item:hover {
    background: var(--link-hover);
  }

  .link-item .icon {
    width: 18px;
    text-align: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .link-item.no-icon {
    padding-left: 34px;
  }

  @media (max-width: 480px) {
    .content { padding: 40px 28px 48px; height: 420px; }
    .name { font-size: 24px; }
  }
</style>
</head>
<body>

        <a class="link-item" href="https://t.me/frstup6dedit" target="_blank" rel="noopener">

  <script>
    // ---- Paste your latest TikTok video links here, newest first ----
    // Just add the link when you post a new edit — no need to upload any image.
    // The thumbnail is fetched automatically from TikTok via their oEmbed API.
    const TIKTOK_VIDEO_URLS = [
      "https://www.tiktok.com/@frstup6d/video/7653555699057691935",
      "https://www.tiktok.com/@frstup6d/video/7649902393361960223",
      "https://www.tiktok.com/@frstup6d/video/7643179037707341087",
      "https://www.tiktok.com/@frstup6d/video/7639257260165729567",
      "https://www.tiktok.com/@frstup6d/video/7639671499279879454",
    ];

    // ---- Optional manual fallback thumbnails ----
    // If TikTok's oEmbed can't be reached (CORS issues, TikTok downtime, etc.),
    // you can drop a local image here as backup, e.g. "edit-1.jpg".
    // Leave as null to just show a dark empty tile instead.
    const FALLBACK_THUMBS = [null, null, null, null, null];

    async function fetchOEmbed(url) {
      const target = `https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`;

      // Try a direct request first (works if TikTok ever allows it).
      try {
        const res = await fetch(target);
        if (res.ok) return await res.json();
      } catch (e) { /* blocked by CORS, fall through to proxy */ }

      // Fall back to a CORS proxy so the browser can read the response.
      try {
        const proxied = `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`;
        const res = await fetch(proxied);
        if (res.ok) return await res.json();
      } catch (e) { /* proxy also failed */ }

      return null;
    }

    async function loadRecentEdits() {
      const slots = document.querySelectorAll('#edits-grid .edit-thumb');

      await Promise.all(TIKTOK_VIDEO_URLS.slice(0, slots.length).map(async (url, i) => {
        const slot = slots[i];
        const data = await fetchOEmbed(url);

        if (data && data.thumbnail_url) {
          slot.href = url;
          slot.querySelector('img').src = data.thumbnail_url;
        } else {
          console.warn('Could not load TikTok thumbnail for', url, '— using fallback if set');
          slot.href = url;
          if (FALLBACK_THUMBS[i]) {
            slot.querySelector('img').src = FALLBACK_THUMBS[i];
          }
        }
      }));
    }

    loadRecentEdits();
  </script>
